name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      # no `judge` group here: mlx-lm runs on Apple silicon only, the tests need neither a model nor the network;
      # `report` brings matplotlib for the figure tests (and numpy, which metrics and report need)
      - run: uv sync --locked --group pool --group report --group dev
      - run: uv run ruff check .
      - run: uv run pytest -m "not slow"
      # every committed judge and classifier directory (every folder of judges/ and classifiers/) must stay valid
      - name: Validate the committed judges and classifiers
        run: |
          shopt -s nullglob
          for d in judges/*/ classifiers/*/; do uv run bench validate "$d"; done

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # the Docker image rather than gitleaks-action: no licence key to manage, and the version is pinned by digest
      - name: Scan every commit of the history, secrets redacted in the log
        run: >
          docker run --rm -v "$PWD":/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --log-opts="--all"
