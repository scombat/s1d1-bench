# Weekly dependency updates, one pull request per ecosystem for the minor and patch bumps.
# Actions stay pinned by SHA with their version comment: Dependabot updates both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
