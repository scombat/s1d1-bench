[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1d1-bench"
version = "0.1.0"
description = "Open bench kit: judge s1d1 prompts with local LLM judges and measure how well a classifier agrees with them"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steve Combat" }]
dependencies = [
    "pyarrow",
]

[project.scripts]
bench = "s1d1_bench.cli:main"

[dependency-groups]
pool = ["datasets", "huggingface_hub"]
judge = ["mlx-lm"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/s1d1_bench"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the model weights or the network",
]
